<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Elmer Jose Muñoz Zuñiga, IT Business Analyst. Six colored icon orbs: Business means clarity, Data means evidence, Payments means traceability, Process means flow, People means empathy, Software means craft.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f4f0"/><stop offset="1" stop-color="#f1efea"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e88e5"/><stop offset="1" stop-color="#2f5bea"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#221c33" opacity=".09"/></pattern>
    <clipPath id="frame"><rect width="1200" height="460" rx="28"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="orb-amber" cx=".32" cy=".26" r=".8"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f08a1d"/></radialGradient>
    <radialGradient id="halo-amber"><stop offset="0" stop-color="#ffc46b" stop-opacity=".75"/><stop offset="1" stop-color="#ffc46b" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb-sage" cx=".32" cy=".26" r=".8"><stop offset="0" stop-color="#b9e29a"/><stop offset="1" stop-color="#4f9a46"/></radialGradient>
    <radialGradient id="halo-sage"><stop offset="0" stop-color="#a7d98e" stop-opacity=".75"/><stop offset="1" stop-color="#a7d98e" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb-orchid" cx=".32" cy=".26" r=".8"><stop offset="0" stop-color="#f0b4fa"/><stop offset="1" stop-color="#a24fc2"/></radialGradient>
    <radialGradient id="halo-orchid"><stop offset="0" stop-color="#f1aee6" stop-opacity=".75"/><stop offset="1" stop-color="#f1aee6" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb-sun" cx=".32" cy=".26" r=".8"><stop offset="0" stop-color="#ffe98a"/><stop offset="1" stop-color="#ebb000"/></radialGradient>
    <radialGradient id="halo-sun"><stop offset="0" stop-color="#ffe27a" stop-opacity=".75"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb-blue" cx=".32" cy=".26" r=".8"><stop offset="0" stop-color="#9bb7ff"/><stop offset="1" stop-color="#2f5bea"/></radialGradient>
    <radialGradient id="halo-blue"><stop offset="0" stop-color="#a9c1ff" stop-opacity=".75"/><stop offset="1" stop-color="#a9c1ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb-teal" cx=".32" cy=".26" r=".8"><stop offset="0" stop-color="#9de9dd"/><stop offset="1" stop-color="#23978b"/></radialGradient>
    <radialGradient id="halo-teal"><stop offset="0" stop-color="#93e3d6" stop-opacity=".75"/><stop offset="1" stop-color="#93e3d6" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb-coral" cx=".32" cy=".26" r=".8"><stop offset="0" stop-color="#ffb39e"/><stop offset="1" stop-color="#e8483a"/></radialGradient>
    <radialGradient id="halo-coral"><stop offset="0" stop-color="#ffab96" stop-opacity=".75"/><stop offset="1" stop-color="#ffab96" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb-azure" cx=".32" cy=".26" r=".8"><stop offset="0" stop-color="#a9d6ff"/><stop offset="1" stop-color="#2f7cf0"/></radialGradient>
    <radialGradient id="halo-azure"><stop offset="0" stop-color="#a3d0ff" stop-opacity=".75"/><stop offset="1" stop-color="#a3d0ff" stop-opacity="0"/></radialGradient>
    <style>
      text { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .area { font-size: 11px; font-weight: 800; letter-spacing: 2.4px; fill: #625b73; }
      .word { font-family: Georgia, 'Times New Roman', serif; font-size: 22px; font-weight: 700; }
      .blob { animation: drift 18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(40px, 20px) scale(1.08); } 100% { transform: translate(-30px, 30px) scale(.95); } }
      .bob { animation: bob 6s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      .halo { animation: glow 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes glow { 0%, 100% { opacity: .22; transform: scale(.92); } 50% { opacity: .4; transform: scale(1.02); } }
      .pulse { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0% { opacity: .6; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.6); } }
      @media (prefers-reduced-motion: reduce) { .bob, .halo, .pulse { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="url(#bg)"/>
    <ellipse cx="1150" cy="0" rx="520" ry="300" fill="url(#halo-blue)" opacity=".45"/>
    <ellipse cx="40" cy="470" rx="440" ry="240" fill="url(#halo-amber)" opacity=".35"/>
    <rect width="1200" height="460" fill="url(#dots)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="459" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".9"/>

  <g transform="translate(600 62)">
    <rect x="-124" y="-17" width="248" height="34" rx="17" fill="#ffffff" fill-opacity=".8" stroke="#221c33" stroke-opacity=".08"/>
    <circle cx="-102" cy="0" r="5" fill="#2bb673" class="pulse"/>
    <circle cx="-102" cy="0" r="5" fill="#2bb673"/>
    <text x="8" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#221c33" letter-spacing="1.2">CV · IT BUSINESS ANALYST</text>
  </g>
  <text x="600" y="140" text-anchor="middle" class="serif" font-size="54" font-weight="700" fill="#221c33">Elmer Jose Muñoz Zuñiga</text>
  <text x="600" y="184" text-anchor="middle" font-size="19" fill="#625b73">Banking &amp; payments <tspan fill="#2f5bea">·</tspan> ISO 20022 <tspan fill="#2f5bea">·</tspan> Data &amp; automation <tspan fill="#2f5bea">·</tspan> UX &amp; HCI</text>
  <rect x="520" y="204" width="160" height="4" rx="2" fill="url(#accent)"/>

  <g class="bob" style="animation-delay:0s">
    <circle cx="170" cy="300" r="75.60000000000001" fill="url(#halo-amber)" class="halo" opacity=".3" style="animation-delay:0s"/>
    <ellipse cx="170" cy="332.4" rx="28.8" ry="10.080000000000002" fill="#f08a1d" opacity=".35" filter="url(#soft)"/>
    <circle cx="170" cy="300" r="36" fill="url(#orb-amber)"/>
    <ellipse cx="159.92" cy="278.4" rx="12.24" ry="5.3999999999999995" fill="#fff" opacity=".18"/>
    <g transform="translate(152.9 282.9) scale(1.4249999999999998)" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7"/><path d="M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0 -1 3a2 2 0 0 1 -4 0a3.5 3.5 0 0 0 -1 -3"/><line x1="9.7" y1="17" x2="14.3" y2="17"/></g>
  </g>
  <text x="170" y="372" text-anchor="middle" class="area">BUSINESS</text>
  <text x="170" y="400" text-anchor="middle" class="word" fill="#8f4a05">Clarity</text>
  <g class="bob" style="animation-delay:0.35s">
    <circle cx="342" cy="300" r="75.60000000000001" fill="url(#halo-azure)" class="halo" opacity=".3" style="animation-delay:0.35s"/>
    <ellipse cx="342" cy="332.4" rx="28.8" ry="10.080000000000002" fill="#2f7cf0" opacity=".35" filter="url(#soft)"/>
    <circle cx="342" cy="300" r="36" fill="url(#orb-azure)"/>
    <ellipse cx="331.92" cy="278.4" rx="12.24" ry="5.3999999999999995" fill="#fff" opacity=".18"/>
    <g transform="translate(324.9 282.9) scale(1.4249999999999998)" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6a8 3 0 0 0 16 0v-6"/><path d="M4 12v6a8 3 0 0 0 16 0v-6"/></g>
  </g>
  <text x="342" y="372" text-anchor="middle" class="area">DATA</text>
  <text x="342" y="400" text-anchor="middle" class="word" fill="#1a4fae">Evidence</text>
  <g class="bob" style="animation-delay:0.7s">
    <circle cx="514" cy="300" r="75.60000000000001" fill="url(#halo-coral)" class="halo" opacity=".3" style="animation-delay:0.7s"/>
    <ellipse cx="514" cy="332.4" rx="28.8" ry="10.080000000000002" fill="#e8483a" opacity=".35" filter="url(#soft)"/>
    <circle cx="514" cy="300" r="36" fill="url(#orb-coral)"/>
    <ellipse cx="503.92" cy="278.4" rx="12.24" ry="5.3999999999999995" fill="#fff" opacity=".18"/>
    <g transform="translate(496.9 282.9) scale(1.4249999999999998)" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="7" x2="3" y2="7"/><path d="M18 10l3 -3l-3 -3"/><path d="M6 20l-3 -3l3 -3"/><line x1="3" y1="17" x2="21" y2="17"/></g>
  </g>
  <text x="514" y="372" text-anchor="middle" class="area">PAYMENTS</text>
  <text x="514" y="400" text-anchor="middle" class="word" fill="#9e2a1c">Traceability</text>
  <g class="bob" style="animation-delay:1.05s">
    <circle cx="686" cy="300" r="75.60000000000001" fill="url(#halo-sage)" class="halo" opacity=".3" style="animation-delay:1.05s"/>
    <ellipse cx="686" cy="332.4" rx="28.8" ry="10.080000000000002" fill="#4f9a46" opacity=".35" filter="url(#soft)"/>
    <circle cx="686" cy="300" r="36" fill="url(#orb-sage)"/>
    <ellipse cx="675.92" cy="278.4" rx="12.24" ry="5.3999999999999995" fill="#fff" opacity=".18"/>
    <g transform="translate(668.9 282.9) scale(1.4249999999999998)" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M12 19h4.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h3.5"/></g>
  </g>
  <text x="686" y="372" text-anchor="middle" class="area">PROCESS</text>
  <text x="686" y="400" text-anchor="middle" class="word" fill="#2c6123">Flow</text>
  <g class="bob" style="animation-delay:1.4s">
    <circle cx="858" cy="300" r="75.60000000000001" fill="url(#halo-orchid)" class="halo" opacity=".3" style="animation-delay:1.4s"/>
    <ellipse cx="858" cy="332.4" rx="28.8" ry="10.080000000000002" fill="#a24fc2" opacity=".35" filter="url(#soft)"/>
    <circle cx="858" cy="300" r="36" fill="url(#orb-orchid)"/>
    <ellipse cx="847.92" cy="278.4" rx="12.24" ry="5.3999999999999995" fill="#fff" opacity=".18"/>
    <g transform="translate(840.9 282.9) scale(1.4249999999999998)" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/><path d="M12 6l-3.293 3.293a1 1 0 0 0 0 1.414l.543 .543c.69 .69 1.81 .69 2.5 0l1 -1a3.182 3.182 0 0 1 4.5 0l2.25 2.25"/><path d="M12.5 15.5l2 2"/><path d="M15 13l2 2"/></g>
  </g>
  <text x="858" y="372" text-anchor="middle" class="area">PEOPLE</text>
  <text x="858" y="400" text-anchor="middle" class="word" fill="#6f2a8a">Empathy</text>
  <g class="bob" style="animation-delay:1.75s">
    <circle cx="1030" cy="300" r="75.60000000000001" fill="url(#halo-blue)" class="halo" opacity=".3" style="animation-delay:1.75s"/>
    <ellipse cx="1030" cy="332.4" rx="28.8" ry="10.080000000000002" fill="#2f5bea" opacity=".35" filter="url(#soft)"/>
    <circle cx="1030" cy="300" r="36" fill="url(#orb-blue)"/>
    <ellipse cx="1019.92" cy="278.4" rx="12.24" ry="5.3999999999999995" fill="#fff" opacity=".18"/>
    <g transform="translate(1012.9 282.9) scale(1.4249999999999998)" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 8 3 12 7 16"/><polyline points="17 8 21 12 17 16"/><line x1="14" y1="4" x2="10" y2="20"/></g>
  </g>
  <text x="1030" y="372" text-anchor="middle" class="area">SOFTWARE</text>
  <text x="1030" y="400" text-anchor="middle" class="word" fill="#1e3fae">Craft</text>
</svg>
